name: Engage on X (Smart Comments)

on:
  schedule:
    # 3 times a day (UTC): 04:30, 10:00, 15:00 (approx 10:00, 15:30, 20:30 IST)
    - cron: "30 4 * * *"
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass spacing / limits"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: x-engagement
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smart engagement
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS="--engagement-live"
          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python -m app.main $ARGS

      - name: Commit engagement history
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state/engagement.json ]; then
            git add -f state/engagement.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: record smart engagement replies [skip ci]"
              git push
            fi
          fi
