[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x-automation"
version = "0.1.0"
description = "Curated, high-impact tech news and open-source project automation for X (Twitter)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "Pillow>=10.0,<14.0",
    "python-dotenv>=1.0,<2.0",
    "tzdata>=2024.1",
]

[project.scripts]
x-bot = "app.main:cli"
